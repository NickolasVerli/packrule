spring.application.name=packrule
server.address=${SERVIDOR_ENDERECO:127.0.0.1}
server.port=${SERVIDOR_PORTA:8080}
spring.datasource.url=${BANCO_URL:jdbc:postgresql://localhost:5432/packrule}
spring.datasource.username=${BANCO_USUARIO:packrule}
spring.datasource.password=${BANCO_SENHA:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/dados-iniciais.sql
spring.sql.init.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
packrule.origens-permitidas=${FRONTEND_ORIGENS:http://localhost:5173,http://127.0.0.1:5173}
packrule.ocr.comando=${OCR_COMANDO:}
packrule.ocr.idiomas=${OCR_IDIOMAS:eng}
