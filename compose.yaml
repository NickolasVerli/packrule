services:
  banco:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: packrule
      POSTGRES_USER: ${BANCO_USUARIO:-packrule}
      POSTGRES_PASSWORD: ${BANCO_SENHA:?Defina BANCO_SENHA no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-postgres:
